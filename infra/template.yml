AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: My Driver - Fullstack serverless deployment

Globals:
  Function:
    Timeout: 30
    Runtime: nodejs20.x
    MemorySize: 512

Resources:
  # ==========================================
  # Storage - S3 Buckets
  # ==========================================

  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins:
              - '*'
            AllowedMethods:
              - PUT
              - GET
            AllowedHeaders:
              - Content-Type
            ExposeHeaders:
              - ETag
            MaxAgeSeconds: 3600

  WebAppBucket:
    Type: AWS::S3::Bucket
    Properties:
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  WebAppBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebAppBucket
      PolicyDocument:
        Statement:
          - Sid: AllowCloudFrontOAC
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${WebAppBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}'

  # ==========================================
  # Database - DynamoDB
  # ==========================================

  ItemsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-Items'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: ownerParent
          AttributeType: S
        - AttributeName: sortKey
          AttributeType: S
        - AttributeName: parentId
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByOwnerParent
          KeySchema:
            - AttributeName: ownerParent
              KeyType: HASH
            - AttributeName: sortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByParentId
          KeySchema:
            - AttributeName: parentId
              KeyType: HASH
            - AttributeName: sortKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  SharesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: !Sub '${AWS::StackName}-Shares'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: ownerId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: ByOwnerId
          KeySchema:
            - AttributeName: ownerId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: ByItemId
          KeySchema:
            - AttributeName: itemId
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL

  # ==========================================
  # Compute - Lambda + API Gateway
  # ==========================================

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: main.handler
      CodeUri: ../dist/apps/api-lambda/
      Environment:
        Variables:
          NODE_ENV: production
          S3_BUCKET: !Ref FilesBucket
          DYNAMODB_ITEMS_TABLE: !Ref ItemsTable
          DYNAMODB_SHARES_TABLE: !Ref SharesTable
          ALLOWED_ORIGINS: '*'
          S3_PRESIGNED_URL_EXPIRY: '3600'
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref SharesTable
        - S3CrudPolicy:
            BucketName: !Ref FilesBucket
      Events:
        ApiProxy:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # ==========================================
  # CDN - CloudFront
  # ==========================================

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub '${AWS::StackName}-oac'
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        PriceClass: PriceClass_100
        Origins:
          - Id: WebAppS3
            DomainName: !GetAtt WebAppBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: ApiGateway
            DomainName: !Sub '${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
            CustomOriginConfig:
              OriginProtocolPolicy: https-only
              OriginSSLProtocols:
                - TLSv1.2
        DefaultCacheBehavior:
          TargetOriginId: WebAppS3
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: ApiGateway
            ViewerProtocolPolicy: https-only
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
              - PUT
              - PATCH
              - POST
              - DELETE
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # CachingDisabled
            OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # AllViewerExceptHostHeader
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
            ErrorCachingMinTTL: 0

Outputs:
  CloudFrontUrl:
    Description: URL da aplicacao
    Value: !Sub 'https://${CloudFrontDistribution.DomainName}'
  ApiGatewayUrl:
    Description: URL direta da API (via API Gateway)
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com'
  WebAppBucketName:
    Description: Bucket S3 para o frontend
    Value: !Ref WebAppBucket
  FilesBucketName:
    Description: Bucket S3 para arquivos do usuario
    Value: !Ref FilesBucket
  CloudFrontDistributionId:
    Description: ID da distribuicao CloudFront (para invalidacao de cache)
    Value: !Ref CloudFrontDistribution
  ItemsTableName:
    Description: Nome da tabela DynamoDB de items
    Value: !Ref ItemsTable
  SharesTableName:
    Description: Nome da tabela DynamoDB de shares
    Value: !Ref SharesTable
